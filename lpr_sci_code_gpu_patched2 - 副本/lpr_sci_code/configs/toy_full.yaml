seed: 42

data:
  dataset_dir: ./toy_processed
  max_seq_len: 50
  path_len: 5

model:
  hidden_dim: 32
  dropout: 0.10
  num_gnn_layers: 2

variant:
  graph_type: rgcn
  kb_mode: forget_attention
  reward_mode: dense
  candidate_mode: review_augmented

reward:
  mastery_gain: 1.0
  prereq_ok: 0.25
  diff_match: 0.20
  review_recover: 0.20
  repeat_penalty: 0.10
  target_bonus: 1.00
  coherence: 0.20
  path_cost: 0.05

train:
  device: cuda
  num_workers: 0
  pin_memory: true
  kt_batch_size: 32
  kt_epochs: 1
  kt_lr: 0.001
  graph_epochs: 10
  graph_lr: 0.001
  graph_margin: 1.0
  lpr_batch_size: 8
  bc_epochs: 1
  bc_lr: 0.001
  rl_epochs: 1
  rl_lr: 0.0002
  ppo_epochs: 1
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  gamma: 0.99
  gae_lambda: 0.95
  gru4rec_batch_size: 32
  gru4rec_epochs: 1
  gru4rec_lr: 0.001

output:
  output_dir: ./outputs/toy
  kt_ckpt: ./outputs/toy/kt_best.pt
