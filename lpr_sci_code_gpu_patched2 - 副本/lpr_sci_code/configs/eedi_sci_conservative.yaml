seed: 42

data:
  dataset_dir: ./data/processed/eedi
  max_seq_len: 100
  path_len: 10

model:
  hidden_dim: 128
  dropout: 0.10
  num_gnn_layers: 2

variant:
  graph_type: rgcn
  kb_mode: forget_attention
  reward_mode: dense
  candidate_mode: review_augmented

reward:
  mastery_gain: 1.0
  prereq_ok: 0.20
  diff_match: 0.15
  review_recover: 0.15
  repeat_penalty: 0.10
  target_bonus: 1.00
  coherence: 0.20
  path_cost: 0.05

train:
  device: cuda
  num_workers: 0
  pin_memory: true
  kt_batch_size: 64
  kt_epochs: 10
  kt_lr: 0.001
  graph_epochs: 60
  graph_lr: 0.001
  graph_margin: 1.0
  lpr_batch_size: 32
  bc_epochs: 5
  bc_lr: 0.001
  rl_epochs: 8
  rl_lr: 0.0002
  ppo_epochs: 2
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  gamma: 0.99
  gae_lambda: 0.95
  gru4rec_batch_size: 64
  gru4rec_epochs: 8
  gru4rec_lr: 0.001

output:
  output_dir: ./outputs/eedi_sci_conservative
  kt_ckpt: ./outputs/eedi_sci_conservative/kt_best.pt
